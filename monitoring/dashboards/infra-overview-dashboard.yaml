apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-infra-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"   # matches grafana.sidecar.dashboards.label in prometheus-values.yaml
data:
  infra-overview.json: |
    {
      "title": "Infrastructure Overview",
      "uid": "infra-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1, "title": "CPU Usage by Node", "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{
            "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
            "legendFormat": "{{instance}}"
          }],
          "fieldConfig": {"defaults": {"unit": "percent", "max": 100}}
        },
        {
          "id": 2, "title": "Memory Usage by Node", "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{
            "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
            "legendFormat": "{{instance}}"
          }],
          "fieldConfig": {"defaults": {"unit": "percent", "max": 100}}
        },
        {
          "id": 3, "title": "Disk Usage (root fs)", "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{
            "expr": "(1 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})) * 100",
            "legendFormat": "{{instance}}"
          }],
          "fieldConfig": {"defaults": {"unit": "percent", "max": 100}}
        },
        {
          "id": 4, "title": "Pod Count by Namespace", "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{
            "expr": "sum(kube_pod_info) by (namespace)",
            "legendFormat": "{{namespace}}"
          }]
        },
        {
          "id": 5, "title": "Network I/O by Node", "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16},
          "targets": [
            {"expr": "rate(node_network_receive_bytes_total{device!=\"lo\"}[5m])", "legendFormat": "{{instance}} rx"},
            {"expr": "rate(node_network_transmit_bytes_total{device!=\"lo\"}[5m])", "legendFormat": "{{instance}} tx"}
          ],
          "fieldConfig": {"defaults": {"unit": "Bps"}}
        }
      ]
    }